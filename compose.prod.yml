services:
  user:
    build:
      context: ./user
      dockerfile: prod.Dockerfile
    ports: ["3000:3000"]
    env_file: ./.env
    depends_on: [api]
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: prod.Dockerfile
    ports: ["127.0.0.1:3001:3000"]
    env_file: ./.env
    depends_on: [api]
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: prod.Dockerfile
    expose: ["8080"]
    env_file: ./.env
    depends_on: [mysql, seaweed-filer]
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  seaweed-master:
    image: chrislusf/seaweedfs:4.47
    command: "master -ip=seaweed-master -port=9333"
    expose: ["9333", "19333"]
    volumes:
      - seaweed-master-data:/data
    restart: unless-stopped

  seaweed-volume:
    image: chrislusf/seaweedfs:4.47
    command: "volume -mserver=seaweed-master:9333 -ip=seaweed-volume -port=8080 -dir=/data"
    depends_on: [seaweed-master]
    expose: ["8080", "18080"]
    volumes:
      - seaweed-volume-data:/data
    restart: unless-stopped

  seaweed-filer:
    image: chrislusf/seaweedfs:4.47
    command: "filer -master=seaweed-master:9333 -ip=seaweed-filer -port=8888"
    depends_on: [seaweed-master, seaweed-volume]
    expose: ["8888", "18888"]
    volumes:
      - seaweed-filer-data:/data
    restart: unless-stopped

volumes:
  mysql-data:
  seaweed-master-data:
  seaweed-volume-data:
  seaweed-filer-data:
