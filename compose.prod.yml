services:
  user:
    build:
      context: ./user
      dockerfile: prod.Dockerfile
    ports: ["3000:3000"]
    env_file: ./.env
    depends_on: [api]
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: prod.Dockerfile
    ports: ["127.0.0.1:3001:3000"]
    env_file: ./.env
    depends_on: [api]
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: prod.Dockerfile
    expose: ["8080"]
    env_file: ./.env
    depends_on: [mysql]
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
