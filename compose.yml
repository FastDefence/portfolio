services:
  user:
    build:
      context: ./user
      dockerfile: Dockerfile
    volumes:
      - type: bind
        source: ./user
        target: /app
      - type: volume
        source: user_node_modules
        target: /app/node_modules
      - type: volume
        source: user_next
        target: /app/.next
    env_file: ./.env
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && npm run dev"
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
      - admin_next:/app/.next
    env_file: ./.env
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [api]
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    expose: ["8080"]
    volumes:
      - ./api:/app
      - go-mod-cache:/go/pkg/mod
    env_file: ./.env
    depends_on: [mysql]
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    expose: ["3306"]
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  user_node_modules:
  user_next:
  admin_node_modules:
  admin_next:
  mysql-data:
  go-mod-cache:
